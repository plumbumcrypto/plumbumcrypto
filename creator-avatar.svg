<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4af37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0d878;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#grad1)" stroke="#1a1a2e" stroke-width="3"/>
  
  <!-- Face -->
  <circle cx="100" cy="85" r="45" fill="#f4a460" stroke="#8b6914" stroke-width="2"/>
  
  <!-- Wizard hat -->
  <path d="M 70 55 L 100 20 L 130 55 Z" fill="#4a0e4e" stroke="#d4af37" stroke-width="2"/>
  <rect x="65" y="55" width="70" height="8" fill="#d4af37" stroke="#8b6914" stroke-width="1"/>
  
  <!-- Eyes -->
  <circle cx="85" cy="80" r="5" fill="#1a1a2e"/>
  <circle cx="115" cy="80" r="5" fill="#1a1a2e"/>
  <circle cx="86" cy="79" r="2" fill="#d4af37"/>
  <circle cx="116" cy="79" r="2" fill="#d4af37"/>
  
  <!-- Nose -->
  <polygon points="100,85 97,92 103,92" fill="#d2a679" stroke="#8b6914" stroke-width="1"/>
  
  <!-- Beard -->
  <path d="M 75 95 Q 100 110 125 95" fill="#8b7355" stroke="#654321" stroke-width="2"/>
  <path d="M 78 100 Q 100 108 122 100" fill="#a0826d" stroke="#654321" stroke-width="1.5"/>
  
  <!-- Smile -->
  <path d="M 85 98 Q 100 105 115 98" stroke="#8b6914" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Robes -->
  <ellipse cx="100" cy="155" rx="50" ry="35" fill="#4a0e4e" stroke="#d4af37" stroke-width="2"/>
  
  <!-- Gold stars on robes -->
  <text x="75" y="150" font-size="20" fill="#d4af37">✦</text>
  <text x="125" y="165" font-size="20" fill="#d4af37">✦</text>
  <text x="100" y="180" font-size="20" fill="#d4af37">✦</text>
</svg>