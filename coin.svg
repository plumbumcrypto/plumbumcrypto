<svg xmlns="http://w3.org" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Градиенты для фона монеты -->
    <linearGradient id="bg-silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F5F5"/>
      <stop offset="100%" stop-color="#9E9E9E"/>
    </linearGradient>
    <linearGradient id="bg-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>

    <!-- Маски для разделения монеты ровно пополам -->
    <clipPath id="left-side">
      <rect x="0" y="0" width="16" height="32"/>
    </clipPath>
    <clipPath id="right-side">
      <rect x="16" y="0" width="16" height="32"/>
    </clipPath>
  </defs>

  <!-- БАЗА МОНЕТЫ -->
  <!-- Левая серебряная сторона -->
  <g clip-path="url(#left-side)">
    <circle cx="16" cy="16" r="15" fill="url(#bg-silver)"/>
    <circle cx="16" cy="16" r="13" fill="none" stroke="#757575" stroke-width="0.75"/>
  </g>
  <!-- Правая золотая сторона с лучами солнца -->
  <g clip-path="url(#right-side)">
    <circle cx="16" cy="16" r="15" fill="url(#bg-gold)"/>
    <circle cx="16" cy="16" r="13" fill="none" stroke="#E65100" stroke-width="0.75"/>
    <!-- Лучи солнца (упрощенные геометрические линии) -->
    <path d="M16 16 L28 7 M16 16 L31 16 M16 16 L28 25 M16 16 L22 3 M16 16 L22 29" stroke="#FFD54F" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- СИЛУЭТ РЫЧАЩЕГО ЛЬВА (ПО ЦЕНТРУ) -->
  <!-- Темный контур для читаемости на мелком масштабе 32х32 -->
  <path d="M7 23 C7 17, 10 11, 14 10 C15 9, 17 9, 18 10 C21 11, 21 14, 20 15 C22 15, 23 16, 23 18 C23 19, 21 20, 19 20 C22 21, 22 23, 21 24 C19 25, 17 24, 16 23 C14 25, 11 25, 9 25 C8 25, 7 24, 7 23 Z" fill="#212121"/>
  
  <!-- Детали головы льва (серебряные штрихи слева, золотые справа) -->
  <g fill="#FFFFFF">
    <!-- Грива и пасть (левая сторона) -->
    <path d="M9 22 C9 18, 11 13, 14 12 C13 15, 11 17, 11 20 Z"/>
    <path d="M11 13 C12 11, 14 11, 15 11 Z"/>
    <path d="M14 16 L17 16 L16 17 Z"/> <!-- Зубы -->
  </g>
  <g fill="#FFF59D">
    <!-- Морда и нос (правая сторона) -->
    <path d="M16 12 C18 12, 19 13, 19 15 C18 15, 17 14, 16 14 Z"/>
    <path d="M18 17 C19 17, 20 18, 19 19 C18 19, 17 18, 18 17 Z"/>
  </g>

  <!-- ЦЕНТРАЛЬНАЯ МИНИ-МОНЕТА В ПАСТИ -->
  <circle cx="17" cy="18" r="2.5" fill="#FFD54F" stroke="#E65100" stroke-width="0.5"/>

  <!-- ЧИСЛО «82» ВНИЗУ ОБОДКА -->
  <!-- Подложка под цифры -->
  <rect x="11" y="25" width="10" height="5" rx="1" fill="#37474F"/>
  <!-- Текст «82» -->
  <text x="16" y="29" font-family="Arial, sans-serif" font-size="4.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">82</text>
</svg>
