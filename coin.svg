<svg xmlns="http://w3.org" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Градиенты для фона монеты -->
    <linearGradient id="bg-silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#D6D6D6"/>
      <stop offset="100%" stop-color="#8A8A8A"/>
    </linearGradient>
    <linearGradient id="bg-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3"/>
      <stop offset="50%" stop-color="#FFAA00"/>
      <stop offset="100%" stop-color="#B36200"/>
    </linearGradient>

    <!-- Маски для разделения монеты и стрелки ровно пополам -->
    <clipPath id="left-side">
      <rect x="0" y="0" width="16" height="32"/>
    </clipPath>
    <clipPath id="right-side">
      <rect x="16" y="0" width="16" height="32"/>
    </clipPath>
  </defs>

  <!-- БАЗА МОНЕТЫ -->
  <!-- Левая серебряная сторона -->
  <g clip-path="url(#left-side)">
    <circle cx="16" cy="16" r="15" fill="url(#bg-silver)"/>
    <circle cx="16" cy="16" r="13" fill="none" stroke="#757575" stroke-width="0.75"/>
    <circle cx="16" cy="16" r="11" fill="none" stroke="#A6A6A6" stroke-width="0.5" stroke-dasharray="1 1"/>
  </g>
  <!-- Правая золотая сторона -->
  <g clip-path="url(#right-side)">
    <circle cx="16" cy="16" r="15" fill="url(#bg-gold)"/>
    <circle cx="16" cy="16" r="13" fill="none" stroke="#804000" stroke-width="0.75"/>
    <circle cx="16" cy="16" r="11" fill="none" stroke="#FFD700" stroke-width="0.5" stroke-dasharray="1 1"/>
  </g>

  <!-- ГЕОМЕТРИЧЕСКАЯ СТРЕЛКА СЛЕВА НАПРАВО (В ЦЕНТРЕ) -->
  <!-- Общий темный контур-подложка для объема и читаемости 32х32 -->
  <path d="M6 14 H18 V9 L27 16 L18 23 V18 H6 Z" fill="#1A1A1A" stroke="#1A1A1A" stroke-width="1" stroke-linejoin="round"/>

  <!-- Левая (серебряная) часть стрелки -->
  <path d="M6 14 H16 V18 H6 Z" fill="#FFFFFF" clip-path="url(#left-side)"/>

  <!-- Правая (золотая) часть стрелки -->
  <g clip-path="url(#right-side)">
    <!-- Хвост стрелки, заходящий на правую сторону -->
    <path d="M16 14 H18 V18 H16 Z" fill="#FFE57F"/>
    <!-- Наконечник стрелки -->
    <path d="M18 9 L27 16 L18 23 Z" fill="#FFE57F"/>
    <!-- Внутренний блик на наконечнике для объема -->
    <path d="M18 11 L23.5 16 L18 21 Z" fill="#FFD54F"/>
  </g>

  <!-- ЧИСЛО «82» ВНИЗУ ОБОДКА -->
  <!-- Тёмная подложка плашки -->
  <path d="M10 24.5 L22 24.5 C23 24.5, 23 29.5, 22 29.5 L10 29.5 C9 29.5, 9 24.5, 10 24.5 Z" fill="#263238"/>
  <path d="M10 24.5 L22 24.5" stroke="#FFD54F" stroke-width="0.4" opacity="0.7"/>
  <!-- Текст -->
  <text x="16" y="28.7" font-family="'Arial Black', sans-serif" font-size="4.8" font-weight="900" fill="#FFFFFF" text-anchor="middle">82</text>
</svg>
